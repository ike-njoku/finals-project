<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gait Analysis Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #07111c;
        color: #e8f1f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(
          circle at top,
          #11283b 0%,
          #07111c 52%,
          #040a10 100%
        );
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 4vw, 2.6rem);
      }

      .subtitle {
        margin-top: 8px;
        color: #98b0c4;
      }

      .mode-badge {
        padding: 10px 14px;
        border: 1px solid #29465c;
        border-radius: 999px;
        background: rgba(10, 25, 37, 0.78);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 16px;
      }

      .card {
        background: rgba(9, 25, 38, 0.88);
        border: 1px solid #1d3b51;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
      }

      .sensors {
        grid-column: span 4;
      }
      .prediction {
        grid-column: span 8;
      }
      .probabilities {
        grid-column: span 7;
      }
      .metrics {
        grid-column: span 5;
      }

      @media (max-width: 800px) {
        .sensors,
        .prediction,
        .probabilities,
        .metrics {
          grid-column: span 12;
        }
      }

      .card h2 {
        margin: 0 0 18px;
        font-size: 1rem;
        color: #a9c1d3;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .sensor-row,
      .metric-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(60, 92, 115, 0.3);
      }

      .sensor-row:last-child,
      .metric-row:last-child {
        border-bottom: none;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #6c7d89;
        box-shadow: 0 0 0 4px rgba(108, 125, 137, 0.1);
      }

      .dot.online {
        background: #45d483;
        box-shadow: 0 0 0 4px rgba(69, 212, 131, 0.12);
      }

      .prediction-value {
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        line-height: 1;
      }

      .confidence {
        margin-top: 14px;
        font-size: 1.15rem;
        color: #a9c1d3;
      }

      .probability-row {
        margin: 15px 0;
      }

      .probability-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 7px;
      }

      .bar-track {
        height: 12px;
        border-radius: 999px;
        background: #0f2638;
        overflow: hidden;
      }

      .bar-value {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #50a8ff, #50e2b2);
        transition: width 220ms ease;
      }

      .big-number {
        font-size: 1.6rem;
        font-weight: 700;
      }

      .muted {
        color: #8198aa;
      }

      .progress-track {
        width: 100%;
        height: 8px;
        margin-top: 12px;
        border-radius: 999px;
        overflow: hidden;
        background: #0f2638;
      }

      .progress-value {
        height: 100%;
        width: 0;
        background: #50a8ff;
        transition: width 150ms ease;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Personalized Gait Analysis</h1>
          <div class="subtitle">Live wearable IMU activity recognition</div>
        </div>
        <div id="mode" class="mode-badge">idle</div>
      </header>

      <section class="grid">
        <article class="card sensors">
          <h2>Sensor status</h2>
          <div id="sensor-list"></div>
        </article>

        <article class="card prediction">
          <h2>Current activity</h2>
          <div id="prediction" class="prediction-value">—</div>
          <div id="confidence" class="confidence">
            Waiting for a complete window
          </div>
          <div class="progress-track">
            <div id="window-progress" class="progress-value"></div>
          </div>
          <div id="buffer-copy" class="muted" style="margin-top: 8px"></div>
        </article>

        <article class="card probabilities">
          <h2>Class probabilities</h2>
          <div id="probability-list" class="muted">No prediction yet.</div>
        </article>

        <article class="card metrics">
          <h2>Runtime</h2>
          <div class="metric-row">
            <span>Inference latency</span>
            <span id="latency" class="big-number">—</span>
          </div>
          <div class="metric-row">
            <span>Sampling rate</span>
            <span id="sampling-rate" class="big-number">50 Hz</span>
          </div>
          <div class="metric-row">
            <span>Window</span>
            <span id="window-size" class="big-number">100</span>
          </div>
          <div class="metric-row">
            <span>Arduino clients</span>
            <span id="arduino-count" class="big-number">0 / 3</span>
          </div>
        </article>
      </section>
    </main>

    <script>
      const sensorList = document.querySelector("#sensor-list");
      const probabilityList = document.querySelector("#probability-list");

      function renderSensors(nodes) {
        sensorList.innerHTML = "";

        for (const [node, connected] of Object.entries(nodes)) {
          const row = document.createElement("div");
          row.className = "sensor-row";
          row.innerHTML = `
          <strong>${node[0].toUpperCase() + node.slice(1)}</strong>
          <span class="status">
            <span class="dot ${connected ? "online" : ""}"></span>
            ${connected ? "Connected" : "Waiting"}
          </span>
        `;
          sensorList.appendChild(row);
        }
      }

      function renderProbabilities(probabilities) {
        const entries = Object.entries(probabilities || {}).sort(
          (a, b) => b[1] - a[1],
        );

        if (!entries.length) {
          probabilityList.className = "muted";
          probabilityList.textContent = "No prediction yet.";
          return;
        }

        probabilityList.className = "";
        probabilityList.innerHTML = entries
          .map(([label, value]) => {
            const percent = value * 100;
            return `
          <div class="probability-row">
            <div class="probability-label">
              <span>${label.toUpperCase()}</span>
              <span>${percent.toFixed(1)}%</span>
            </div>
            <div class="bar-track">
              <div class="bar-value" style="width: ${percent}%"></div>
            </div>
          </div>
        `;
          })
          .join("");
      }

      function renderState(state) {
        document.querySelector("#mode").textContent = state.mode.replaceAll(
          "_",
          " ",
        );
        document.querySelector("#sampling-rate").textContent =
          `${state.sampling_rate_hz} Hz`;
        document.querySelector("#window-size").textContent = state.window_size;
        document.querySelector("#arduino-count").textContent =
          `${state.connected_arduinos} / ${state.required_arduinos}`;

        renderSensors(state.nodes);

        const currentBuffer = state.buffers?.window || 0;
        const progress = Math.min(
          100,
          (currentBuffer / state.window_size) * 100,
        );
        document.querySelector("#window-progress").style.width = `${progress}%`;
        document.querySelector("#buffer-copy").textContent =
          `Window buffer: ${currentBuffer} / ${state.window_size} aligned samples`;

        if (!state.prediction) {
          document.querySelector("#prediction").textContent = "—";
          document.querySelector("#confidence").textContent =
            state.mode === "inference"
              ? "Waiting for a complete window"
              : "Inference is not currently running";
          document.querySelector("#latency").textContent = "—";
          renderProbabilities({});
          return;
        }

        document.querySelector("#prediction").textContent =
          state.prediction.activity;
        document.querySelector("#confidence").textContent =
          `${(state.prediction.confidence * 100).toFixed(1)}% confidence`;
        document.querySelector("#latency").textContent =
          `${state.prediction.latency_ms.toFixed(1)} ms`;

        renderProbabilities(state.prediction.probabilities);
      }

      async function refresh() {
        try {
          const response = await fetch("/api/state", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          renderState(await response.json());
        } catch (error) {
          document.querySelector("#mode").textContent = "server unavailable";
        }
      }

      refresh();
      setInterval(refresh, 350);
    </script>
  </body>
</html>
